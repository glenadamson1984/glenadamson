<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc"><title id="title">The Football Coach product preview</title><desc id="desc">A black and orange preview of the Portadown coaching concept, with a football pitch and a dribbling route.</desc><rect width="1400" height="1000" fill="#151a16"/><rect x="60" y="60" width="1280" height="880" rx="24" fill="#19211b" stroke="#3c4a3e"/><path d="M60 152h1280" stroke="#3c4a3e"/><rect x="100" y="89" width="44" height="44" rx="12" fill="#ffab70"/><text x="111" y="121" font-family="Arial,Helvetica,sans-serif" font-size="33" font-weight="bold" fill="#151a16">f.</text><text x="164" y="123" font-family="Arial,Helvetica,sans-serif" font-size="32" font-weight="bold" fill="#fff">The Football Coach</text><text x="1040" y="120" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#ffbf96">PORTADOWN · NI</text><text x="110" y="252" font-family="Arial,Helvetica,sans-serif" font-size="19" letter-spacing="3" fill="#ffab70">MORE TOUCHES. MORE CONFIDENCE.</text><text x="108" y="355" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="bold" fill="#f5f3ed">Room to try.</text><text x="108" y="443" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="bold" fill="#ffab70">Confidence</text><text x="108" y="531" font-family="Arial,Helvetica,sans-serif" font-size="72" font-weight="bold" fill="#ffab70">to play.</text><text x="110" y="605" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#bbc7bc">A future one-to-one</text><text x="110" y="646" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#bbc7bc">football coaching concept.</text><rect x="110" y="715" width="285" height="67" rx="10" fill="#ffab70"/><text x="252" y="757" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="bold" text-anchor="middle" fill="#152019">Register interest</text><text x="110" y="855" font-family="Arial,Helvetica,sans-s